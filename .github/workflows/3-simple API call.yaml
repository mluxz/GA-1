name: 3 - simple - API

on:
    schedule:
     - cron: '56 13 * * *'
     - cron: '09 14 * * *' 
    workflow_dispatch:

jobs:
    fetch_data:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout the repository
            uses: actions/checkout@v4

          - name: Install jq
            run: sudo apt-get install jq

          - name: fetch data
            run: |
              TIMESTAMP=$(date +%s)
              OUTPUT_FILE="stage/${TIMESTAMP}.csv"
              mkdir -p stage
              curl -s -H "User-Agent: Chrome/123.0" https://www.sahamyab.com/guest/twiter/list?v=0.1 | jq items[] | [.id, .sendTime, .sendTimePersian, .senderName, .senderUsername, .type, .content] | join(",") ' > $OUTPUT_FILE
              echo "Data saved to $OUTPUT_FILE"
          
          - name: Commit and push changes
            run: |
              git config --local user.email "me.nxzbbyni@gmail.com"
              git config --local use.name "menaz"
              git add stage/
              git commit -m "fetch data at $(date)"
              git push

            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}